name: Build Physio Weekly episode

on:
  schedule:
    # Mondays 09:32 and 11:02 Tehran (UTC+3:30). The Apps Script writes the
    # script between 07:00 and 08:00; the second run is a backup and does
    # nothing if the episode is already published.
    - cron: "2 6 * * 1"
    - cron: "32 7 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if this week's episode already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build episode and feed
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          PODCAST_TOKEN: ${{ secrets.PODCAST_TOKEN }}
          TTS_VOICE: en-US-EmmaMultilingualNeural
          FORCE: ${{ inputs.force && '1' || '' }}
        run: python build_episode.py

      - name: Publish
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A docs
          git commit -m "Episode $(date -u +%F)" || echo "Nothing to commit"
          git push
